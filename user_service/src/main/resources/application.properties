spring.application.name = user-service

spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/paymesh?createDatabaseIfNotExist=true}

spring.jpa.hibernate.ddl-auto = update
# Off: with one session per request, the login lookup cached the User before the row lock was taken, so
# "SELECT ... FOR UPDATE" returned that stale copy and concurrent failed logins overwrote each other's count.
spring.jpa.open-in-view = false

server.port = 8081

spring.kafka.bootstrap-servers = ${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.apache.kafka.common.serialization.StringSerializer

# Correlation id from the api_gateway (see CorrelationIdLoggingFilter)
logging.pattern.level = %5p [%X{correlationId:-}]

# Java 21 virtual threads for Tomcat requests, Kafka listeners and @Scheduled tasks (all blocking I/O)
spring.threads.virtual.enabled = true
