server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved every 10 s: a recreated gateway container gets a new IP
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8080;

    # Same-origin API, like the dev server's proxy.conf.json, so no CORS
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        # Appends the real client address; the gateway trusts exactly this one hop (TRUSTED_PROXY_COUNT=1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (/pay, /history, ...) all serve the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
