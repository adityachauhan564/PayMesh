server.port = 8082

spring.kafka.bootstrap-servers = ${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset = earliest

# Gmail: use an App Password. Leave MAIL_USERNAME unset to just log mails.
spring.mail.host = ${MAIL_HOST:smtp.gmail.com}
spring.mail.port = ${MAIL_PORT:587}
spring.mail.username = ${MAIL_USERNAME:}
spring.mail.password = ${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

# Java 21 virtual threads for Tomcat requests, Kafka listeners and @Scheduled tasks (all blocking I/O)
spring.threads.virtual.enabled = true
