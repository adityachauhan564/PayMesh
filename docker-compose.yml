# Whole stack:      docker compose up -d --build        → app and API on http://localhost:4200
# Infra only (run services from the IDE / mvnw):  docker compose up -d mysql kafka redis
# Only the UI port is published for the app; services talk to each other on the compose network.
# Infra ports stay published on localhost for IDE runs.
name: paymesh

x-spring-service: &spring-service
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-service-env: &service-env
  KAFKA_SERVERS: kafka:19092
  # Tokens are RS256, signed by user-service; everyone else verifies them against its public keys
  JWT_JWKS_URI: http://user-service:8081/.well-known/jwks.json

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env (copy .env.example)}
      # Read by deploy/mysql/init/01-service-schemas.sh: one schema and user per service, created with the volume
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set it in .env (copy .env.example)}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?set it in .env (copy .env.example)}
      TXN_DB_PASSWORD: ${TXN_DB_PASSWORD:?set it in .env (copy .env.example)}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during first-run init MySQL serves the socket only, so this waits for the real server
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Two listeners: containers use kafka:19092, apps on the host (IDE) use localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Login rate-limit buckets (api_gateway) and notification eventId claims. Losing them is harmless, so no volume.
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]

  user-service:
    <<: *spring-service
    build: { context: ., args: { SERVICE: user_service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD:?set it in .env (copy .env.example)}
      # Empty = a new signing key per start (older access tokens stop verifying; the web app refreshes them)
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REDIS_HOST: redis
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  wallet-service:
    <<: *spring-service
    build: { context: ., args: { SERVICE: wallet_service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/wallet_db
      DB_USERNAME: wallet_svc
      DB_PASSWORD: ${WALLET_DB_PASSWORD:?set it in .env (copy .env.example)}

  transaction-service:
    <<: *spring-service
    build: { context: ., args: { SERVICE: transaction_service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/txn_db
      DB_USERNAME: txn_svc
      DB_PASSWORD: ${TXN_DB_PASSWORD:?set it in .env (copy .env.example)}

  notification-service:
    <<: *spring-service
    build: { context: ., args: { SERVICE: notification_service } }
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      KAFKA_SERVERS: kafka:19092
      REDIS_HOST: redis
      JWT_JWKS_URI: http://user-service:8081/.well-known/jwks.json
      # Unset = mails are logged instead of sent (see notification_service)
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  api-gateway:
    build: { context: ., args: { SERVICE: api_gateway } }
    restart: unless-stopped
    depends_on: [redis, user-service, wallet-service, transaction-service]
    environment:
      USER_SERVICE_URL: http://user-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8091
      TRANSACTION_SERVICE_URL: http://transaction-service:8086
      REDIS_HOST: redis
      JWT_JWKS_URI: http://user-service:8081/.well-known/jwks.json
      # Every request arrives through the wallet-ui nginx, which appends the client IP to X-Forwarded-For.
      # Safe only because the gateway port is not published: nothing can reach it around nginx.
      TRUSTED_PROXY_COUNT: 1

  # The only published app port: Angular app plus /api proxied to the gateway
  wallet-ui:
    build: ./wallet-ui
    restart: unless-stopped
    depends_on: [api-gateway]
    ports: ["127.0.0.1:4200:8080"]

volumes:
  mysql-data:
