spring.application.name = wallet-service

spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/wallet_db}

spring.jpa.hibernate.ddl-auto = validate
# Off: sessions end with the service transaction; nothing lazy-loads in controllers or views
spring.jpa.open-in-view = false

server.port = 8091

spring.kafka.bootstrap-servers = ${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.apache.kafka.common.serialization.StringSerializer

# Correlation id from the api_gateway (see CorrelationIdLoggingFilter)
logging.pattern.level = %5p [%X{correlationId:-}]

# Java 21 virtual threads for Tomcat requests, Kafka listeners and @Scheduled tasks (all blocking I/O)
spring.threads.virtual.enabled = true

# Ledger reconciliation (cached balances vs postings), one replica at a time via ShedLock
ledger.reconcile-cron = ${LEDGER_RECONCILE_CRON:0 30 2 * * *}

# Metrics, logs and traces (shared settings in paymesh-common)
spring.config.import = optional:classpath:paymesh-observability.properties
