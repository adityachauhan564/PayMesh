# Shared observability settings, imported by every service (spring.config.import).
# Traces, logs and metrics go over OTLP to one collector (grafana/otel-lgtm in compose). Off by default, so tests
# and plain IDE runs don't try to reach a collector; compose sets OTLP_ENABLED=true.

management.endpoints.web.exposure.include = health
management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = never

management.tracing.sampling.probability = ${TRACING_SAMPLING:1.0}
management.tracing.export.otlp.enabled = ${OTLP_ENABLED:false}
management.logging.export.otlp.enabled = ${OTLP_ENABLED:false}
management.otlp.metrics.export.enabled = ${OTLP_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint = ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint = ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.url = ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step = 10s
# Histogram buckets for saga latency, so dashboards can show p50/p95/p99
management.metrics.distribution.percentiles-histogram.paymesh.payments.duration = true

# Kafka sends and receives become spans, and the trace context travels in record headers
spring.kafka.template.observation-enabled = true
spring.kafka.listener.observation-enabled = true
