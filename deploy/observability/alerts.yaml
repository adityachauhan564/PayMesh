# Grafana alert rules for PayMesh (YAML provisioning; JSON syntax is valid YAML)
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "paymesh",
      "folder": "PayMesh",
      "interval": "1m",
      "rules": [
        {
          "uid": "outbox-backlog",
          "title": "Outbox backlog growing",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Events are piling up in an outbox: Kafka or the relay is behind"
          },
          "labels": {
            "team": "paymesh"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(paymesh_outbox_backlog)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "max"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        100
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "dead-letters",
          "title": "Dead letters waiting",
          "condition": "C",
          "for": "0m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "A message failed all retries and is waiting in dead_letter for replay or discard"
          },
          "labels": {
            "team": "paymesh"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(paymesh_deadletters_new)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "max"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "ledger-mismatch",
          "title": "Ledger out of balance",
          "condition": "C",
          "for": "0m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "The nightly reconciliation found wallets whose balance doesn't match their postings"
          },
          "labels": {
            "team": "paymesh"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(paymesh_ledger_mismatches)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "max"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}