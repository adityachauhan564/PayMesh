{{- $ctx := dict "root" $ "name" "kafka" }}
# Kafka through the Strimzi operator (installed by scripts/k3d-up.sh): one KRaft node that is controller and broker.
# Topics are auto-created on first use, as in compose; the <topic>.DLT topics appear with the first dead letter.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: node
  labels:
    {{- include "paymesh.labels" $ctx | nindent 4 }}
    strimzi.io/cluster: paymesh
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: {{ .Values.kafka.storage }}
    deleteClaim: false
  resources: {{- toYaml .Values.kafka.resources | nindent 4 }}
  jvmOptions:
    "-Xms": {{ .Values.kafka.heap }}
    "-Xmx": {{ .Values.kafka.heap }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: paymesh
  labels: {{- include "paymesh.labels" $ctx | nindent 4 }}
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        # Strimzi turns this into the listener's NetworkPolicy: only pods that use Kafka
        networkPolicyPeers:
          - podSelector:
              matchLabels: { paymesh.io/uses-kafka: "true" }
    config:
      auto.create.topics.enable: true
      num.partitions: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      group.initial.rebalance.delay.ms: 0
