{{- /*
Who may connect to whom (ingress only; egress is open). Everything is denied unless a policy below allows it:
  Traefik -> wallet-ui -> api-gateway -> services; the services -> user-service (JWKS), data stores and lgtm.
Kafka's listener policy is generated by Strimzi from networkPolicyPeers (kafka.yaml).
*/}}
{{- $ctx := dict "root" $ "name" "network" }}
{{- define "paymesh.allow" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .to }}
  labels: {{- include "paymesh.labels" (dict "root" .root "name" .to) | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: {{ .to }} }
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .from | nindent 8 }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - { port: {{ . }} }
        {{- end }}
      {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "paymesh.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- $app := list (dict "podSelector" (dict "matchLabels" (dict "paymesh.io/app" "true"))) }}
{{- $gateway := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "api-gateway"))) }}
{{- $traefik := list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")) "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "traefik"))) }}
{{- include "paymesh.allow" (dict "root" $ "to" "wallet-ui" "from" $traefik "ports" (list 8080)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "api-gateway" "from" (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "wallet-ui")))) "ports" (list 8080)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "user-service" "from" (concat $gateway $app) "ports" (list 8081)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "wallet-service" "from" $gateway "ports" (list 8091)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "transaction-service" "from" $gateway "ports" (list 8086)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "mysql" "from" (list (dict "podSelector" (dict "matchLabels" (dict "paymesh.io/uses-mysql" "true")))) "ports" (list 3306)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "redis" "from" (list (dict "podSelector" (dict "matchLabels" (dict "paymesh.io/uses-redis" "true")))) "ports" (list 6379)) }}
{{- include "paymesh.allow" (dict "root" $ "to" "lgtm" "from" $app "ports" (list 4318)) }}
