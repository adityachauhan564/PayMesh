version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /wallet-ui
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/, /wallet-ui]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # The JDK is part of these tags (3.9-eclipse-temurin-21, 21-jre) and stays on the project's Java 21;
      # the tags float, so patch releases still arrive on every rebuild.
      - dependency-name: maven
      - dependency-name: eclipse-temurin
