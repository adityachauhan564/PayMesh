version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /wallet-ui
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/, /wallet-ui]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
